services:
  inspector-web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["node","dist/web/server.mjs"]
    init: true
    environment:
      DATA_DIR: /data
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - inspector-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  inspector-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["node","dist/worker/worker.mjs"]
    init: true
    environment:
      DATA_DIR: /data
      WORKER_HEALTH_HOST: 127.0.0.1
      WORKER_HEALTH_PORT: 9901
    volumes:
      - inspector-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:9901/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  inspector-data:
