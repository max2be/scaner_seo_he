# Replace inspector.example.com with the exact PUBLIC_ORIGIN hostname.
# Private operator certificates are mounted read-only; no automatic external ACME calls.
pid /tmp/nginx.pid;
worker_processes 2;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;
    limit_conn_zone $binary_remote_addr zone=hsi_connections:1m;
    map $uri $hsi_login_key { default ""; /api/auth/login $binary_remote_addr; }
    limit_req_zone $hsi_login_key zone=hsi_login:1m rate=1r/s;
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }
    server {
        listen 8443 ssl;
        server_name inspector.example.com;
        ssl_certificate /etc/hsi/tls/cert.pem;
        ssl_certificate_key /etc/hsi/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:hsi_tls:1m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        limit_conn hsi_connections 20;
        limit_req zone=hsi_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @throttled;
        location @throttled {
            default_type application/json;
            add_header Retry-After 1 always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"error":"login_throttled","retryAfter":1}';
        }
        location / {
            proxy_pass http://inspector-web:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_hide_header Server;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Content-Type-Options;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
